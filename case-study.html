<!DOCTYPE html>
<!-- ================================================================
  case-study.html — reusable single template
  Reads ?id=<project-id> from the URL, resolves it against
  DATA.projects in main.js, and renders the project's caseStudy.
    - One file serves every project (content lives in DATA).
    - Unknown / missing id falls back to the first project.
    - Porting to React/Next.js: replace with a dynamic route
      /projects/[id] where the caseStudy maps to a component.
================================================================ -->
